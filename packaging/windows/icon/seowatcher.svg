<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-label="seowatcher">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b1816"/>
      <stop offset="1" stop-color="#0c0b0a"/>
    </linearGradient>
    <radialGradient id="iris" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd27a"/>
      <stop offset="0.45" stop-color="#ff8a1f"/>
      <stop offset="1" stop-color="#d9480f"/>
    </radialGradient>
    <clipPath id="eye">
      <path d="M26 128 Q128 34 230 128 Q128 222 26 128 Z"/>
    </clipPath>
  </defs>
  <rect width="256" height="256" rx="48" fill="url(#bg)"/>
  <!-- Eye white (dark here) inside the lids, so the iris reads as a separate disc. -->
  <path d="M26 128 Q128 34 230 128 Q128 222 26 128 Z" fill="#241d19"/>
  <!-- Iris, clipped by the lids. -->
  <g clip-path="url(#eye)">
    <circle cx="128" cy="128" r="54" fill="url(#iris)"/>
  </g>
  <!-- Lids. -->
  <path d="M26 128 Q128 34 230 128 Q128 222 26 128 Z" fill="none" stroke="#ff8a1f" stroke-width="12" stroke-linejoin="round"/>
  <!-- Slit pupil. -->
  <path d="M128 84 Q141 128 128 172 Q115 128 128 84 Z" fill="#0c0b0a"/>
  <!-- Catch light. -->
  <circle cx="148" cy="108" r="9" fill="#fff4e0"/>
</svg>
