# seowatcher.io on the Hetzner VPS (nginx). Install as
#   /etc/nginx/sites-available/seowatcher.io.conf
# with docs/nginx-site-headers.conf as
#   /etc/nginx/snippets/seowatcher-headers.conf
# The steps (first certificate, enabling, updates, checks) are in
# docs/SITE_DEPLOY.md. Run `sudo nginx -t` before every reload.
#
# Layout: every upload is its own folder under /var/www/seowatcher/releases/,
# and /var/www/seowatcher/current is a symlink to the live one.

# HTTP: certificate challenges, everything else to HTTPS on the apex.
server {
    listen 80;
    listen [::]:80;
    server_name seowatcher.io www.seowatcher.io;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        try_files $uri =404;
    }
    location / {
        return 301 https://seowatcher.io$request_uri;
    }
}

# HTTPS www: one 301 to the apex, path and query kept.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.seowatcher.io;
    ssl_certificate /etc/letsencrypt/live/seowatcher.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/seowatcher.io/privkey.pem;
    include /etc/nginx/snippets/seowatcher-headers.conf;
    return 301 https://seowatcher.io$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name seowatcher.io;
    ssl_certificate /etc/letsencrypt/live/seowatcher.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/seowatcher.io/privkey.pem;
    server_tokens off;

    root /var/www/seowatcher/current;
    index index.html;
    charset utf-8;
    charset_types text/plain text/css text/xml application/javascript application/json application/xml application/atom+xml application/manifest+json image/svg+xml;
    # The headers snippet also turns gzip on. Brotli needs the module
    # (Debian/Ubuntu: libnginx-mod-http-brotli-filter); only then uncomment:
    # brotli on;
    # brotli_comp_level 5;
    # brotli_types text/css application/javascript application/json application/xml application/atom+xml image/svg+xml application/manifest+json;
    include /etc/nginx/snippets/seowatcher-headers.conf;

    # A folder answers with its index.html; "/docs" becomes "/docs/" by 301.
    # Anything else is a real 404 with site/404.html, never an SPA fallback.
    error_page 404 /404.html;
    location / {
        try_files $uri $uri/ =404;
    }
    location = /404.html {
        internal;
    }
    # Dot files stay private; .well-known is public.
    location ~ /\.(?!well-known/) {
        deny all;
    }
    # site/_headers is the header file for other hosts; nginx uses the snippet.
    location = /_headers {
        return 404;
    }

    # Former privacy addresses, as real redirects. The HTML refresh pages in
    # site/ remain for hosts that cannot send a 301.
    location = /privacy/ { return 301 /gizlilik/; }
    location = /de/privacy/ { return 301 /de/datenschutz/; }
    location = /fr/privacy/ { return 301 /fr/confidentialite/; }
    location = /pt/privacy/ { return 301 /pt/privacidade/; }

    # Cache lifetimes mirror site/_headers. `expires` (not add_header) keeps
    # the snippet's security headers inherited; the one location that needs
    # add_header includes the snippet again, because nginx drops inherited
    # add_header lines in any block that has its own.
    location ~* \.html$ {
        expires -1;
    }
    location ^~ /assets/ {
        expires 7d;
    }
    location ^~ /assets/logos/ {
        expires 30d;
    }
    location ^~ /assets/fonts/ {
        include /etc/nginx/snippets/seowatcher-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }
    location = /sitemap.xml {
        types { }
        default_type application/xml;
        expires 1h;
    }
    location ~ ^/(?:[a-z]{2}/)?feed\.xml$ {
        types { }
        default_type application/atom+xml;
        expires 1h;
    }
    location = /site.webmanifest {
        types { }
        default_type application/manifest+json;
        expires 1d;
    }
    location = /.well-known/security.txt {
        expires 1d;
    }
    location = /robots.txt {
        expires 1h;
    }
    location = /llms.txt {
        expires 1h;
    }
}
