# Hetzner nginx example. Replace root, certificate and include paths with
# verified server paths before enabling. This file has not been deployed.
server {
    listen 80;
    listen [::]:80;
    server_name seowatcher.io www.seowatcher.io;
    return 301 https://seowatcher.io$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.seowatcher.io;
    ssl_certificate /etc/letsencrypt/live/seowatcher.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/seowatcher.io/privkey.pem;
    include /etc/nginx/snippets/seowatcher-headers.conf;
    return 301 https://seowatcher.io$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name seowatcher.io;
    ssl_certificate /etc/letsencrypt/live/seowatcher.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/seowatcher.io/privkey.pem;
    root /var/www/seowatcher/current;
    index index.html;
    include /etc/nginx/snippets/seowatcher-headers.conf;

    # Keep real 404 status codes; never use an SPA fallback for this site.
    error_page 404 /404.html;
    location / { try_files $uri $uri/ =404; }
    location = /404.html { internal; }
    location = /.well-known/security.txt { try_files $uri =404; expires 1d; }
    location ~ /\. { deny all; }

    # HTML and versioned scripts must revalidate after a publication.
    # expires preserves server-level security header inheritance.
    location ~* \.(?:html|js|css)$ { expires -1; }
    location ~* \.(?:woff2|png|webp|avif|svg|ico)$ { expires 7d; }
    location = /sitemap.xml { expires 1h; }
    location = /robots.txt { expires 1h; }
    location = /llms.txt { expires 1h; }
}
