<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-label="seotracker: kendi sitenizin SEO'su, kendi bilgisayarınızda">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f0d0c"/>
      <stop offset="1" stop-color="#1c1917"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff7a1a" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#ff7a1a" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
  </defs>

  <!-- surface -->
  <rect width="1280" height="400" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="400" rx="24" fill="url(#grid)"/>
  <rect width="1280" height="400" rx="24" fill="url(#glow)"/>
  <rect x="0.5" y="0.5" width="1279" height="399" rx="23.5" fill="none" stroke="#ffffff" stroke-opacity="0.09"/>

  <g font-family="'Segoe UI', Inter, -apple-system, system-ui, Roboto, Helvetica, Arial, sans-serif">
    <!-- wordmark -->
    <text x="72" y="92" font-size="30" font-weight="700" fill="#f7f3ef" letter-spacing="-0.4">seotracker</text>

    <!-- headline -->
    <text x="72" y="190" font-size="56" font-weight="700" fill="#f9f5f1" letter-spacing="-1.6">Kendi sitenizin SEO'su,</text>
    <text x="72" y="254" font-size="56" font-weight="700" fill="#f9f5f1" letter-spacing="-1.6">kendi bilgisayarınızda.</text>

    <!-- subline -->
    <text x="72" y="318" font-size="24" fill="#c9beb4">Abonelik yok. Verileriniz bilgisayarınızda kalır.</text>
  </g>

  <!-- site score card: the number is the real audit result shown in the screenshots -->
  <g font-family="'Segoe UI', Inter, -apple-system, system-ui, Roboto, Helvetica, Arial, sans-serif">
    <rect x="860" y="88" width="348" height="224" rx="18" fill="#000" fill-opacity="0.35" filter="url(#soft)" transform="translate(0 12)"/>
    <rect x="860" y="88" width="348" height="224" rx="18" fill="#1f1b18"/>
    <rect x="860.5" y="88.5" width="347" height="223" rx="17.5" fill="none" stroke="#ffffff" stroke-opacity="0.12"/>

    <!-- ring: 98 of 100 -->
    <circle cx="944" cy="200" r="56" fill="none" stroke="#ffffff" stroke-opacity="0.10" stroke-width="12"/>
    <circle cx="944" cy="200" r="56" fill="none" stroke="#ff7a1a" stroke-width="12" stroke-linecap="round"
            stroke-dasharray="351.9" stroke-dashoffset="7.0" transform="rotate(-90 944 200)"/>
    <text x="944" y="206" font-size="38" font-weight="700" fill="#f7f3ef" text-anchor="middle" letter-spacing="-1">98</text>
    <text x="944" y="228" font-size="13" fill="#a89d93" text-anchor="middle">/ 100</text>

    <text x="1024" y="172" font-size="13" font-weight="600" fill="#a0948a" letter-spacing="1.6">SİTE PUANI</text>
    <text x="1024" y="204" font-size="22" font-weight="600" fill="#f7f3ef">Çok iyi.</text>
    <text x="1024" y="232" font-size="16" fill="#c9beb4">Birkaç küçük iş kaldı.</text>
  </g>
</svg>
