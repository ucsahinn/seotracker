name: Windows package

# Builds the one-click Windows installer (packaging/windows) and attaches it
# to the GitHub release of the pushed tag. Also runnable by hand to get the
# installer as a workflow artifact without cutting a release.

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

# The build job only reads. The release job below is the only one that may
# write, and it never runs dependency code.
permissions:
  contents: read

concurrency:
  group: windows-package-${{ github.ref }}
  # A cancelled tag run must not leave a half-published release behind.
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      # Empty until the SignPath secrets exist; the signing step checks it.
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Version from tag
        id: version
        shell: pwsh
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          $ref = $env:REF_NAME
          $packaged = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $version = if ($ref -like "v*") { $ref.TrimStart("v") } else { $packaged }
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "version '$version' is not x.y.z" }
          if ($ref -like "v*" -and $version -ne $packaged) { throw "tag $ref does not match package.json version $packaged" }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Build package and installer
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: ./packaging/windows/build.ps1 -Version $env:VERSION

      - name: Upload unsigned installer for signing
        id: unsigned
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: seowatcher-setup-${{ steps.version.outputs.version }}-unsigned
          path: packaging/windows/out/seowatcher-setup-*.exe
          if-no-files-found: error

      # Code signing through SignPath (free for open-source projects). The
      # step runs only once the three repository secrets exist; until then the
      # unsigned installer ships as before. Set-up: docs/CODE_SIGNING.md.
      - name: Sign the installer (SignPath)
        if: ${{ env.SIGNPATH_API_TOKEN != '' }}
        uses: signpath/github-action-submit-signing-request@c92b958760219087e01f8d67a1669ed57afe2627 # v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: seowatcher
          signing-policy-slug: release-signing
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: packaging/windows/out
          parameters: |
            version: "${{ steps.version.outputs.version }}"

      - name: Upload installer artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: seowatcher-setup-${{ steps.version.outputs.version }}
          path: packaging/windows/out/seowatcher-setup-*.exe
          if-no-files-found: error

      - name: Smoke test the installer on this clean runner
        shell: pwsh
        run: |
          $exe = Get-ChildItem packaging/windows/out -Filter "seowatcher-setup-*.exe" | Select-Object -First 1
          $log = Join-Path $env:RUNNER_TEMP "setup-smoke.log"
          # WaitForExit, not -Wait: a silent install relaunches the tray app as a
          # child, and Start-Process -Wait waits for the whole process tree.
          $p = Start-Process -FilePath $exe.FullName -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /LOG=`"$log`"" -PassThru
          if (-not $p.WaitForExit(600000)) { Get-Content $log -Tail 40; throw "installer still running after 10 min" }
          if ($p.ExitCode -ne 0) { Get-Content $log -Tail 40; throw "installer exit $($p.ExitCode)" }
          $app = Join-Path $env:LOCALAPPDATA "Programs\seowatcher\seowatcher.exe"
          if (-not (Test-Path $app)) { throw "launcher not installed at $app" }
          if (-not (Get-Process -Name seowatcher -ErrorAction SilentlyContinue)) { Start-Process -FilePath $app -ArgumentList "--silent" }
          $ok = $false
          foreach ($i in 1..60) {
            Start-Sleep -Seconds 3
            try { $r = Invoke-WebRequest -Uri "http://127.0.0.1:3001/api/health" -UseBasicParsing -TimeoutSec 3; if ($r.StatusCode -eq 200) { $ok = $true; break } } catch {}
          }
          $logs = Join-Path $env:LOCALAPPDATA "seowatcher\logs"
          Write-Host "---- launcher.log"; Get-Content (Join-Path $logs "launcher.log") -ErrorAction SilentlyContinue
          if (-not $ok) {
            Write-Host "---- server.log (tail)"; Get-Content (Join-Path $logs "server.log") -Tail 60 -ErrorAction SilentlyContinue
            Write-Host "---- migrate.log (tail)"; Get-Content (Join-Path $logs "migrate.log") -Tail 20 -ErrorAction SilentlyContinue
            throw "app did not answer /api/health within 6 min"
          }
          Write-Host "health ok"
          # The MCP endpoint must refuse a call without the bearer token.
          $mcp = $null
          try { $mcp = Invoke-WebRequest -Uri "http://127.0.0.1:3001/mcp" -Method Post -ContentType "application/json" -Body '{"jsonrpc":"2.0","id":1,"method":"tools/list"}' -UseBasicParsing -TimeoutSec 5 } catch { $mcp = $_.Exception.Response }
          $code = if ($mcp) { [int]$mcp.StatusCode } else { 0 }
          if ($code -ne 401) { throw "POST /mcp without a token answered $code, expected 401" }
          Write-Host "mcp without token: 401"
          # The generated token must never appear in any log (count only; never printed).
          $token = (Get-Content (Join-Path $env:LOCALAPPDATA "seowatcher\mcp-token") -Raw).Trim()
          $hits = 0
          foreach ($name in "launcher.log", "migrate.log", "server.log") { $f = Join-Path $logs $name; if (Test-Path $f) { $hits += @(Select-String -Path $f -SimpleMatch $token).Count } }
          if ($hits -gt 0) { throw "the MCP token appears $hits time(s) in the logs" }
          Write-Host "token not in logs"
          & $app --quit
          $un = Get-ChildItem (Split-Path $app) -Filter "unins*.exe" | Select-Object -First 1
          $u = Start-Process -FilePath $un.FullName -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART" -PassThru
          if (-not $u.WaitForExit(300000)) { throw "uninstaller still running after 5 min" }
          if ($u.ExitCode -ne 0) { throw "uninstaller exit $($u.ExitCode)" }
          if (Test-Path $app) { throw "launcher still present after uninstall" }
          Write-Host "install, start, health, quit, uninstall: all ok"

  release:
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Download the smoke-tested installer
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: seowatcher-setup-${{ needs.package.outputs.version }}
          path: packaging/windows/out

      - name: Attach to release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          $tag = $env:REF_NAME
          $file = Get-ChildItem packaging/windows/out -Filter "seowatcher-setup-*.exe" | Select-Object -First 1
          # A second copy under a fixed name, so the website can link
          # .../releases/latest/download/seowatcher-setup.exe without knowing
          # the version.
          $stable = Join-Path $file.DirectoryName "seowatcher-setup.exe"
          Copy-Item $file.FullName $stable -Force
          $sha = (Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$sha  $($file.Name)" | Set-Content -Encoding ascii (Join-Path $file.DirectoryName "SHA256SUMS.txt")
          # Release notes come from the CHANGELOG block of this version, so the
          # release is published (not a draft) with the same text the app shows
          # under Ayarlar > Hakkinda. A draft would hide the installer from
          # /releases/latest/download/... and from the app's own updater.
          $version = $tag.TrimStart("v")
          $changelog = Get-Content CHANGELOG.md -Raw -Encoding UTF8
          $m = [regex]::Match($changelog, "(?s)## \[" + [regex]::Escape($version) + "\][^\n]*\n(.*?)(?=\n## \[|\z)")
          $notes = if ($m.Success) { $m.Groups[1].Value.Trim() } else { "seowatcher $version" }
          $notesFile = Join-Path $file.DirectoryName "notes.md"
          [IO.File]::WriteAllText($notesFile, $notes, (New-Object Text.UTF8Encoding $false))
          # Draft first, upload, then publish: /releases/latest never points at a
          # release without its installer. "Latest" only if this is the highest
          # version, so re-tagging an old line cannot demote the current one.
          $current = gh release list --exclude-drafts --exclude-pre-releases --limit 1 --json tagName --jq '.[0].tagName'
          $isLatest = -not $current -or ([version]$version -ge [version]$current.TrimStart("v"))
          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title "v$version" --notes-file $notesFile --draft
          } else {
            gh release edit $tag --notes-file $notesFile
          }
          gh release upload $tag $file.FullName $stable (Join-Path $file.DirectoryName "SHA256SUMS.txt") --clobber
          gh release edit $tag --draft=false --latest=$($isLatest.ToString().ToLower())
