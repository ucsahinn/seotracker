<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{title}} | seowatcher belgeleri</title>
    <meta name="description" content="{{description}}" />
    <meta name="robots" content="max-image-preview:large" />
    <link rel="canonical" href="{{canonical}}" />
    <link rel="icon" href="/assets/icon.svg" type="image/svg+xml" />
    <link
      rel="icon"
      href="/assets/favicon-48.png"
      type="image/png"
      sizes="48x48"
    />
    <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png" />
    <link
      rel="preload"
      href="/assets/fonts/geist-latin-wght-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/assets/fonts/geist-latin-ext-wght-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <meta property="og:type" content="article" />
    <meta property="og:site_name" content="seowatcher" />
    <meta property="og:title" content="{{title}}" />
    <meta property="og:description" content="{{description}}" />
    <meta property="og:image" content="https://seowatcher.io/assets/og.png" />
    <meta property="og:url" content="{{canonical}}" />
    <meta property="og:locale" content="tr_TR" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: light)"
      content="#fdfdfe"
    />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: dark)"
      content="#1a1b20"
    />
    <style>
      @font-face {
        font-family: "Geist";
        font-style: normal;
        font-weight: 100 900;
        font-display: swap;
        src: url(/assets/fonts/geist-latin-ext-wght-normal.woff2)
          format("woff2-variations");
        unicode-range:
          U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF,
          U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020,
          U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
      }
      @font-face {
        font-family: "Geist";
        font-style: normal;
        font-weight: 100 900;
        font-display: swap;
        src: url(/assets/fonts/geist-latin-wght-normal.woff2)
          format("woff2-variations");
        unicode-range:
          U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC,
          U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193,
          U+2212, U+2215, U+FEFF, U+FFFD;
      }
      :root {
        --bg: oklch(99.5% 0.0015 265);
        --bg-2: oklch(97.2% 0.003 265);
        --fg: oklch(23% 0.012 265);
        --muted: oklch(23% 0.012 265 / 0.8);
        --subtle: oklch(23% 0.012 265 / 0.68);
        --hairline: oklch(0% 0 0 / 0.08);
        --hairline-strong: oklch(0% 0 0 / 0.14);
        --accent: oklch(54% 0.17 256);
        --accent-ink: oklch(100% 0 0);
        --accent-link: oklch(42% 0.15 256);
        --ease: cubic-bezier(0.32, 0.72, 0, 1);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: oklch(17.5% 0.005 265);
          --bg-2: oklch(13.2% 0.005 265);
          --fg: oklch(93% 0.004 265);
          --muted: oklch(93% 0.004 265 / 0.7);
          --subtle: oklch(93% 0.004 265 / 0.56);
          --hairline: oklch(100% 0 0 / 0.09);
          --hairline-strong: oklch(100% 0 0 / 0.16);
          --accent: oklch(70% 0.15 256);
          --accent-ink: oklch(16% 0.01 265);
          --accent-link: oklch(80% 0.12 256);
        }
      }
      * {
        box-sizing: border-box;
      }
      html {
        -webkit-text-size-adjust: 100%;
        scroll-padding-top: 76px;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font-family: Geist, "Segoe UI", system-ui, sans-serif;
        font-size: 17px;
        line-height: 1.6;
        font-variant-numeric: tabular-nums;
        -webkit-font-smoothing: antialiased;
      }
      a {
        color: inherit;
        text-decoration: none;
      }
      :focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 3px;
        border-radius: 4px;
      }
      .skip {
        position: absolute;
        left: 16px;
        top: -48px;
        z-index: 5;
        background: var(--accent);
        color: var(--accent-ink);
        padding: 8px 14px;
        border-radius: 999px;
        font-weight: 600;
      }
      .skip:focus {
        top: 12px;
      }
      .wrap {
        width: min(1160px, 100% - 40px);
        margin-inline: auto;
      }
      @media (max-width: 640px) {
        .wrap {
          width: calc(100% - 32px);
        }
      }
      header {
        position: sticky;
        top: 0;
        z-index: 2;
        background: color-mix(in oklab, var(--bg) 82%, transparent);
        backdrop-filter: blur(14px) saturate(1.3);
        -webkit-backdrop-filter: blur(14px) saturate(1.3);
        border-bottom: 1px solid var(--hairline);
      }
      header .wrap {
        display: flex;
        align-items: center;
        justify-content: space-between;
        height: 60px;
        gap: 16px;
      }
      .brand {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        font-weight: 600;
        font-size: 17px;
        letter-spacing: -0.01em;
      }
      .brand img {
        width: 26px;
        height: 26px;
        border-radius: 7px;
      }
      .brand span {
        color: var(--subtle);
        font-weight: 500;
      }
      .topnav {
        display: flex;
        align-items: center;
        gap: 24px;
        font-size: 15px;
        color: var(--muted);
      }
      .topnav a:hover {
        color: var(--fg);
      }
      .btn {
        display: inline-flex;
        align-items: center;
        min-height: 36px;
        padding: 0 14px;
        border-radius: 999px;
        font-weight: 560;
        font-size: 14px;
        background: var(--accent);
        color: var(--accent-ink);
        white-space: nowrap;
        transition:
          transform 320ms var(--ease),
          filter 320ms var(--ease);
      }
      .btn:hover {
        filter: saturate(1.06) brightness(1.05);
        transform: translateY(-1px);
      }
      .btn:active {
        transform: scale(0.98);
      }
      @media (max-width: 720px) {
        .topnav .hide {
          display: none;
        }
        .topnav {
          gap: 14px;
        }
        .brand span {
          display: none;
        }
      }

      .layout {
        display: grid;
        grid-template-columns: 240px minmax(0, 1fr) 200px;
        gap: clamp(32px, 4vw, 64px);
        padding: 40px 0 96px;
      }
      .side {
        position: sticky;
        top: 84px;
        align-self: start;
        font-size: 15px;
      }
      .nav-group {
        margin: 22px 0 8px;
        font-size: 13px;
        font-weight: 600;
        color: var(--subtle);
      }
      .nav-group:first-child {
        margin-top: 0;
      }
      .side ul {
        list-style: none;
        margin: 0;
        padding: 0;
        display: grid;
        gap: 2px;
      }
      .side li a {
        display: block;
        padding: 6px 10px;
        margin-left: -10px;
        border-radius: 8px;
        color: var(--muted);
        transition:
          background-color 240ms var(--ease),
          color 240ms var(--ease);
      }
      .side li a:hover {
        background: var(--bg-2);
        color: var(--fg);
      }
      .side li.current a {
        background: var(--bg-2);
        color: var(--fg);
        font-weight: 600;
      }
      .toc {
        position: sticky;
        top: 84px;
        align-self: start;
        font-size: 14px;
      }
      .toc-label {
        margin: 0 0 8px;
        font-size: 13px;
        font-weight: 600;
        color: var(--subtle);
      }
      .toc ol {
        list-style: none;
        margin: 0;
        padding: 0;
        display: grid;
        gap: 6px;
        border-left: 1px solid var(--hairline);
      }
      .toc a {
        display: block;
        padding-left: 12px;
        color: var(--muted);
      }
      .toc a:hover {
        color: var(--fg);
      }
      @media (max-width: 1100px) {
        .layout {
          grid-template-columns: 220px minmax(0, 1fr);
        }
        .toc {
          display: none;
        }
      }
      @media (max-width: 800px) {
        .layout {
          grid-template-columns: minmax(0, 1fr);
          gap: 24px;
        }
        .side {
          position: static;
          border-bottom: 1px solid var(--hairline);
          padding-bottom: 20px;
        }
      }

      article {
        max-width: 68ch;
      }
      article h1 {
        font-size: clamp(30px, 4vw, 42px);
        line-height: 1.08;
        letter-spacing: -0.028em;
        font-weight: 600;
        margin: 0 0 14px;
        text-wrap: balance;
      }
      article .lede {
        font-size: 19px;
        color: var(--muted);
        margin: 0 0 32px;
        text-wrap: pretty;
      }
      article h2 {
        font-size: 24px;
        letter-spacing: -0.02em;
        margin: 44px 0 12px;
        text-wrap: balance;
      }
      article h3 {
        font-size: 18px;
        letter-spacing: -0.012em;
        margin: 28px 0 8px;
      }
      article p,
      article li {
        color: var(--muted);
      }
      article p {
        margin: 0 0 16px;
        text-wrap: pretty;
      }
      article strong {
        color: var(--fg);
        font-weight: 600;
      }
      article ul,
      article ol {
        margin: 0 0 18px;
        padding-left: 22px;
      }
      article li {
        margin: 0 0 8px;
      }
      article li::marker {
        color: var(--subtle);
      }
      article a {
        color: var(--accent-link);
        text-decoration: underline;
        text-decoration-color: color-mix(
          in oklab,
          var(--accent-link) 35%,
          transparent
        );
        text-underline-offset: 3px;
      }
      article a:hover {
        text-decoration-color: var(--accent-link);
      }
      article code {
        font-family: ui-monospace, Consolas, Menlo, monospace;
        font-size: 0.9em;
        background: var(--bg-2);
        border: 1px solid var(--hairline);
        padding: 1px 6px;
        border-radius: 6px;
        color: var(--fg);
      }
      article pre {
        background: var(--bg-2);
        border: 1px solid var(--hairline);
        border-radius: 12px;
        padding: 14px 16px;
        overflow-x: auto;
        margin: 0 0 18px;
        font-size: 14.5px;
        line-height: 1.5;
      }
      article pre code {
        background: none;
        border: 0;
        padding: 0;
      }
      article blockquote {
        margin: 0 0 18px;
        padding: 2px 0 2px 18px;
        border-left: 2px solid var(--accent);
      }
      article .tw {
        overflow-x: auto;
        margin: 0 0 22px;
      }
      article table {
        border-collapse: collapse;
        width: 100%;
        font-size: 15px;
        min-width: 480px;
      }
      article th {
        text-align: left;
        font-weight: 600;
        color: var(--fg);
        padding: 0 16px 10px 0;
        border-bottom: 1px solid var(--hairline-strong);
        white-space: nowrap;
      }
      article td {
        padding: 10px 16px 10px 0;
        border-bottom: 1px solid var(--hairline);
        vertical-align: top;
        color: var(--muted);
      }
      article td:first-child {
        color: var(--fg);
      }
      article .meta {
        margin-top: 48px;
        padding-top: 18px;
        border-top: 1px solid var(--hairline);
        font-size: 14px;
        color: var(--subtle);
      }
      ul.index {
        list-style: none;
        padding: 0;
        margin: 0 0 24px;
        display: grid;
        gap: 10px;
      }
      ul.index li {
        display: grid;
        gap: 2px;
        padding: 12px 0;
        border-top: 1px solid var(--hairline);
      }
      ul.index li a {
        font-weight: 600;
        color: var(--fg);
        text-decoration: none;
      }
      ul.index li a:hover {
        text-decoration: underline;
      }
      ul.index li span {
        color: var(--muted);
        font-size: 15.5px;
      }
      footer {
        padding: 32px 0 56px;
        font-size: 14.5px;
        color: var(--muted);
        border-top: 1px solid var(--hairline);
      }
      footer .wrap {
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
        gap: 12px 32px;
      }
      footer a:hover {
        color: var(--fg);
      }
    </style>
  </head>
  <body>
    <a class="skip" href="#icerik">İçeriğe geç</a>
    <header>
      <div class="wrap">
        <a class="brand" href="/"
          ><img
            src="/assets/icon-256.png"
            alt=""
            width="26"
            height="26"
          />seowatcher <span>belgeler</span></a
        >
        <nav class="topnav" aria-label="Site">
          <a class="hide" href="/#ekranlar">Ekranlar</a>
          <a class="hide" href="/docs/">Belgeler</a>
          <a class="hide" href="https://github.com/ucsahinn/seotracker"
            >GitHub</a
          >
          <a
            class="btn"
            href="https://github.com/ucsahinn/seotracker/releases/latest/download/seowatcher-setup.exe"
            >Windows için indir</a
          >
        </nav>
      </div>
    </header>
    <div class="wrap layout">
      <aside class="side" aria-label="Belgeler">{{nav}}</aside>
      <article id="icerik">
        {{body}}
        <p class="meta">
          Son güncelleme: {{updated}}. Bir hata görürseniz
          <a href="https://github.com/ucsahinn/seotracker/issues"
            >GitHub'da bildirin</a
          >.
        </p>
      </article>
      {{toc}}
    </div>
    <footer>
      <div class="wrap">
        <span>seowatcher, MIT lisansı.</span>
        <span
          ><a href="/">Ana sayfa</a> &nbsp;
          <a href="https://github.com/ucsahinn/seotracker">GitHub</a> &nbsp;
          <a
            href="https://github.com/ucsahinn/seotracker/blob/main/CHANGELOG.md"
            >Sürüm notları</a
          ></span
        >
      </div>
    </footer>
  </body>
</html>
