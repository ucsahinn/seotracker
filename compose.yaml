services:
  seotracker:
    # Nothing is published for this fork -- it is yours alone, so Compose
    # builds it from this repository the first time you run `up` and reuses
    # that image afterwards. After changing the source: `up -d --build`.
    image: ${SEOTRACKER_IMAGE:-seotracker:local}
    build:
      context: .
      dockerfile: Dockerfile.selfhost
    restart: unless-stopped
    # Forward EVERY .env value into the container. The explicit `environment:`
    # list below still wins for the values it names — without this, any .env
    # value not listed there would silently never reach the app. Optional, so a
    # first run works before you have written one; every value it carries only
    # enables a feature.
    env_file:
      - path: .env
        required: false
    environment:
      # Required for local Docker self-hosting: exposes Compose env vars to cloudflare:workers bindings.
      - CLOUDFLARE_INCLUDE_PROCESS_ENV=true
      - PORT=${PORT:-3001}
      - ALLOWED_HOST=${ALLOWED_HOST:-}
      # Overridable, because it was not: a literal here beats `env_file`, so an
      # operator who read the README's warning and put AUTH_MODE=cloudflare_access
      # in .env got no error, no warning and no authentication. The default is
      # still local_noauth, which is right for a container bound to 127.0.0.1.
      - AUTH_MODE=${AUTH_MODE:-local_noauth}
      # Google Search Console + Analytics. Both integrations share one OAuth
      # client. See docs/SELF_HOSTING_GOOGLE_SEARCH_CONSOLE.md
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      # Encrypts the stored Google OAuth tokens at rest. Must be >= 32 chars or
      # Search Console stays disabled.
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET:-}
      # Google PageSpeed Insights, for the Lighthouse phase of a site audit.
      # Optional: without it the API answers on a much smaller keyless quota.
      - PAGESPEED_API_KEY=${PAGESPEED_API_KEY:-}
      - VITE_SHOW_DEVTOOLS=false
    ports:
      - "127.0.0.1:${PORT:-3001}:${PORT:-3001}"
    volumes:
      - seotracker_data:/app/.wrangler
volumes:
  seotracker_data:
