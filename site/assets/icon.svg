<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-label="seowatcher">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b1816"/>
      <stop offset="1" stop-color="#0c0b0a"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="ember" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#f26b0f"/>
      <stop offset="1" stop-color="#ff8a2a"/>
    </linearGradient>
  </defs>
  <rect width="256" height="256" rx="48" fill="url(#bg)"/>
  <rect x="1.5" y="1.5" width="253" height="253" rx="46.5" fill="none" stroke="url(#rim)" stroke-width="3"/>
  <!-- The dial: a ring open at the top right, and the needle that leaves through the opening. -->
  <circle cx="128" cy="128" r="74" fill="none" stroke="url(#ember)" stroke-width="20" stroke-linecap="round" pathLength="360" stroke-dasharray="252 108" transform="rotate(-16 128 128)"/>
  <path d="M128 128 L192 64" fill="none" stroke="url(#ember)" stroke-width="20" stroke-linecap="round"/>
  <circle cx="128" cy="128" r="14" fill="#ffb36b"/>
</svg>
