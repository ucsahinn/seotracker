<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta
      name="description"
      content="Bu sayfa yok; ana sayfaya ya da kılavuza dönün. This page does not exist; go back to the home page or the guide."
    />
    <title>Sayfa bulunamadı / Page not found | seowatcher</title>
    <link rel="icon" href="/assets/icon.svg" type="image/svg+xml" />
    <style>
      :root {
        --bg: oklch(14% 0.008 60);
        --fg: oklch(97% 0.006 80);
        --muted: oklch(97% 0.006 80 / 0.72);
        --accent: oklch(80% 0.15 68);
        --hairline: oklch(97% 0.006 80 / 0.1);
      }
      /* Dot field: a quiet grid of points over the whole page, and a soft
         ember light that follows the pointer. Fixed, never scrolls, never
         catches the pointer. Two layers: the dim field everyone sees, and the
         lit field clipped to a circle around the pointer (--mx/--my from
         site.js, lerped so it trails rather than snaps). Touch devices, the
         "stop motion" toggle and reduced motion keep only the dim field. */
      .dots,
      .dots::before {
        position: fixed;
        inset: 0;
        z-index: -1;
        pointer-events: none;
        background-image: radial-gradient(
          oklch(100% 0 0 / 0.16) 1px,
          transparent 1.5px
        );
        background-size: 26px 26px;
        background-position: 13px 13px;
      }
      .dots {
        opacity: 0.55;
        mask-image: linear-gradient(
          180deg,
          oklch(0% 0 0 / 0.9),
          oklch(0% 0 0 / 0.35) 40%,
          oklch(0% 0 0 / 0.55)
        );
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font-family: Geist, "Segoe UI", system-ui, sans-serif;
        font-size: 17px;
        line-height: 1.55;
      }
      main {
        max-width: 40rem;
        margin: 18vh auto;
        padding: 0 20px;
      }
      section + section {
        margin-top: 40px;
        padding-top: 32px;
        border-top: 1px solid var(--hairline);
      }
      .brand {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        font-weight: 600;
        color: var(--fg);
        text-decoration: none;
        margin-bottom: 36px;
      }
      .brand img {
        width: 28px;
        height: 28px;
        border-radius: 7px;
      }
      h1,
      h2 {
        width: fit-content;
        background: linear-gradient(100deg, var(--fg) 0%, var(--accent) 100%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        font-size: clamp(28px, 4vw, 40px);
        letter-spacing: -0.025em;
        margin: 0 0 12px;
      }
      p {
        color: var(--muted);
        margin: 0 0 20px;
      }
      a {
        color: var(--accent);
        text-decoration: underline;
        text-underline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <div class="dots" aria-hidden="true"></div>
    <main>
      <a class="brand" href="/"
        ><img
          src="/assets/icon.svg"
          alt=""
          width="28"
          height="28"
        />seowatcher</a
      >
      <section>
        <h1>Bu sayfa yok.</h1>
        <p>Adres yanlış yazılmış ya da sayfa taşınmış olabilir.</p>
        <p>
          <a href="/">Ana sayfaya dön</a> veya
          <a href="/docs/">kılavuza bakın</a>.
        </p>
      </section>
      <section lang="en">
        <h2>This page does not exist.</h2>
        <p>The address may be mistyped, or the page may have moved.</p>
        <p>
          <a href="/en/">Back to the home page</a> or
          <a href="/en/docs/">open the guide</a>.
        </p>
      </section>
    </main>
  </body>
</html>
