<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Sayfa bulunamadı | seowatcher</title>
    <link rel="icon" href="/assets/icon.svg" type="image/svg+xml" />
    <style>
      :root {
        --bg: oklch(99.5% 0.0015 265);
        --fg: oklch(23% 0.012 265);
        --muted: oklch(23% 0.012 265 / 0.8);
        --accent: oklch(42% 0.15 256);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: oklch(17.5% 0.005 265);
          --fg: oklch(93% 0.004 265);
          --muted: oklch(93% 0.004 265 / 0.7);
          --accent: oklch(80% 0.12 256);
        }
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font-family: Geist, "Segoe UI", system-ui, sans-serif;
        font-size: 17px;
        line-height: 1.55;
      }
      main {
        max-width: 40rem;
        margin: 20vh auto;
        padding: 0 20px;
      }
      h1 {
        font-size: clamp(28px, 4vw, 40px);
        letter-spacing: -0.025em;
        margin: 0 0 12px;
      }
      p {
        color: var(--muted);
        margin: 0 0 20px;
      }
      a {
        color: var(--accent);
        text-decoration: underline;
        text-underline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Bu sayfa yok.</h1>
      <p>Adres yanlış yazılmış ya da sayfa taşınmış olabilir.</p>
      <p>
        <a href="/">Ana sayfaya dön</a> veya
        <a href="/docs/">belgelere bakın</a>.
      </p>
    </main>
  </body>
</html>
