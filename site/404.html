<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Sayfa bulunamadı / Page not found | seowatcher</title>
    <link rel="icon" href="/assets/icon.svg" type="image/svg+xml" />
    <style>
      :root {
        --bg: oklch(14% 0.008 60);
        --fg: oklch(97% 0.006 80);
        --muted: oklch(97% 0.006 80 / 0.72);
        --accent: oklch(80% 0.15 68);
        --hairline: oklch(97% 0.006 80 / 0.1);
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font-family: Geist, "Segoe UI", system-ui, sans-serif;
        font-size: 17px;
        line-height: 1.55;
      }
      main {
        max-width: 40rem;
        margin: 18vh auto;
        padding: 0 20px;
      }
      section + section {
        margin-top: 40px;
        padding-top: 32px;
        border-top: 1px solid var(--hairline);
      }
      h1 {
        font-size: clamp(28px, 4vw, 40px);
        letter-spacing: -0.025em;
        margin: 0 0 12px;
      }
      p {
        color: var(--muted);
        margin: 0 0 20px;
      }
      a {
        color: var(--accent);
        text-decoration: underline;
        text-underline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <section>
        <h1>Bu sayfa yok.</h1>
        <p>Adres yanlış yazılmış ya da sayfa taşınmış olabilir.</p>
        <p>
          <a href="/">Ana sayfaya dön</a> veya
          <a href="/docs/">kılavuza bakın</a>.
        </p>
      </section>
      <section lang="en">
        <h1>This page does not exist.</h1>
        <p>The address may be mistyped, or the page may have moved.</p>
        <p>
          <a href="/en/">Back to the home page</a> or
          <a href="/en/docs/">open the guide</a>.
        </p>
      </section>
    </main>
  </body>
</html>
